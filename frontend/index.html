<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      if (window.location.hash === "#dashboard") {
        var transparent = "rgba(0,0,0,0)";
        document.documentElement.style.background = transparent;
        document.documentElement.style.backgroundColor = transparent;
        var s = document.createElement("style");
        s.id = "dashboard-transparent";
        s.textContent = "html,body,#root,.dashboard-bar-wrap{background:rgba(0,0,0,0)!important;background-color:rgba(0,0,0,0)!important;box-shadow:none!important}";
        document.head.appendChild(s);
        document.addEventListener("DOMContentLoaded", function () {
          if (document.body) { document.body.style.background = transparent; document.body.style.backgroundColor = transparent; }
          var r = document.getElementById("root");
          if (r) { r.style.background = transparent; r.style.backgroundColor = transparent; }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) { meta = document.createElement("meta"); meta.name = "theme-color"; document.head.appendChild(meta); }
          meta.content = "rgba(0,0,0,0)";
        });
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <title>Fupo – Desktop Assistant</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
