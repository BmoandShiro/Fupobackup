<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <style>
        .info.legend {
            background: white;
            padding: 8px;
            border-radius: 5px;
            line-height: 1.2;
            font-size: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

            .info.legend i {
                width: 18px;
                height: 18px;
                display: inline-block;
                margin-right: 5px;
            }
    </style>
</head>
<body>

    <div id="map" style="width: 100%; height: 100vh;"></div>

    <script>
        var map = L.map('map').setView([42.3314, -83.0458], 8);  // Default: Detroit
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let heatLayer;
        let heatmapVisible = true;
        let currentZoom = map.getZoom();  // Store initial zoom level

        // 🔹 Color Legend for Temperature Heatmap
        var legend = L.control({ position: 'bottomright' });

        legend.onAdd = function () {
            var div = L.DomUtil.create('div', 'info legend'),
                grades = [0, 5, 10, 15, 20, 25, 30], // Temperature thresholds
                colors = ["blue", "cyan", "green", "yellow", "orange", "red"];

            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + colors[i] + '"></i> ' +
                    grades[i] + (grades[i + 1] ? grades[i] + '°C - ' + grades[i + 1] + '°C<br>' : '°C+');
            }
            return div;
        };

        legend.addTo(map);

        // 🔍 Listen for Zoom Changes & Notify Backend
        map.on('zoomend', function () {
            let newZoom = map.getZoom();
            if (newZoom !== currentZoom) {
                currentZoom = newZoom;
                console.log(`🔍 Zoom level changed: ${currentZoom}`);
                fetch(`/set_zoom/${currentZoom}`)
                    .then(response => response.json())
                    .then(data => {
                        console.log("✅ Server acknowledged zoom change:", data);
                        updateWeatherOverlay();  // Refresh dynamically
                    })
                    .catch(error => console.error("❌ Error sending zoom level:", error));
            }
        });

        // ✅ Function to Update Heatmap Settings (From Python)
        function updateHeatmapSettings(intensity, radius, blur) {
            if (heatLayer) {
                map.removeLayer(heatLayer);
            }

            heatLayer = L.heatLayer(heatmapData, {
                radius: radius,
                blur: blur,
                maxZoom: 12,
                minOpacity: 0.4,
                max: intensity / 10  // Normalize intensity
            }).addTo(map);
        }

        // ✅ Function to Toggle Heatmap Visibility
        function toggleHeatmap() {
            heatmapVisible = !heatmapVisible;
            if (heatLayer) {
                if (heatmapVisible) {
                    map.addLayer(heatLayer);
                } else {
                    map.removeLayer(heatLayer);
                }
            }
        }

        // ✅ Function to Fetch & Update Weather Data
        function updateWeatherOverlay() {
            console.log("🔄 Updating weather data...");

            // 🔹 Fetch and update main weather marker
            fetch('weather_data.json')
                .then(response => response.json())
                .then(data => {
                    if (data.latitude && data.longitude) {
                        var temp = data.temp;
                        var wind_speed = data.wind_speed;
                        var cloud_cover = data.cloud_cover;

                        // Remove old markers
                        map.eachLayer(function (layer) {
                            if (layer instanceof L.Marker || layer instanceof L.Circle) {
                                map.removeLayer(layer);
                            }
                        });

                        // Add new weather marker
                        L.marker([data.latitude, data.longitude])
                            .addTo(map)
                            .bindPopup(`🌡️ Temp: ${temp}°C<br>💨 Wind: ${wind_speed} km/h<br>☁️ Cloud Cover: ${cloud_cover}%`)
                            .openPopup();

                        // Add a circle with color based on temperature
                        var color = temp > 25 ? 'red' : (temp > 15 ? 'orange' : 'blue');
                        L.circle([data.latitude, data.longitude], {
                            color: color,
                            fillColor: color,
                            fillOpacity: 0.5,
                            radius: 5000
                        }).addTo(map);
                    }
                });

            // 🔹 Fetch and update heatmap data
            fetch('heatmap_data.json')
                .then(response => response.json())
                .then(heatmapData => {
                    let heatPoints = heatmapData.map(point => [point.latitude, point.longitude, point.intensity]);

                    // Remove old heatmap before adding new data
                    if (heatLayer) {
                        map.removeLayer(heatLayer);
                    }

                    heatLayer = L.heatLayer(heatPoints, {
                        radius: 30,   // Smooth blending
                        blur: 25,     // Reduce sharp circles
                        maxZoom: 12,  // More detail when zoomed in
                        minOpacity: 0.4
                    });

                    if (heatmapVisible) {
                        heatLayer.addTo(map);
                    }
                })
                .catch(error => console.error("❌ Error loading heatmap data:", error));
        }

        // Auto-update every 60 seconds
        setInterval(updateWeatherOverlay, 60000);
        updateWeatherOverlay();

    </script>

</body>
</html>
