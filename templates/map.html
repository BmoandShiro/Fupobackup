<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <style>
        .info.legend {
            background: white;
            padding: 8px;
            border-radius: 5px;
            line-height: 1.2;
            font-size: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

            .info.legend i {
                width: 18px;
                height: 18px;
                display: inline-block;
                margin-right: 5px;
            }
    </style>
</head>
<body>
    <div id="map" style="width: 100%; height: 100vh;"></div>

    <script>
        var map = L.map('map').setView([42.3314, -83.0458], 8);  // Default: Detroit
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 🔹 Fixed Color Legend for Temperature Circles (not heatmap)
        var legend = L.control({ position: 'bottomright' });

        legend.onAdd = function () {
            var div = L.DomUtil.create('div', 'info legend'),
                grades = [32, 59, 77], // Fahrenheit thresholds for circle colors
                colors = ["blue", "orange", "red"];

            div.innerHTML = '<b>Temperature (°F)</b><br>';
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + colors[i] + '"></i> ' +
                    grades[i] + (grades[i + 1] ? '°F - ' + grades[i + 1] + '°F<br>' : '°F+');
            }
            return div;
        };

        legend.addTo(map);

        // ✅ Function to Fetch & Update Weather Data
        function updateWeatherOverlay() {
            console.log("🔄 Updating weather data...");

            fetch('weather_data.json')
                .then(response => response.json())
                .then(data => {
                    if (data.latitude && data.longitude) {
                        var temp = Math.round((data.temp * 9 / 5) + 32);  // Convert °C → °F
                        var wind_speed = data.wind_speed;
                        var cloud_cover = data.cloud_cover;

                        console.log(`✅ Weather Data Fetched: Latitude: ${data.latitude}, Longitude: ${data.longitude}`);
                        console.log(`🌡️ Temp: ${temp}°F, 💨 Wind: ${wind_speed} km/h, ☁️ Cloud Cover: ${cloud_cover}%`);

                        // Remove old markers and circles
                        map.eachLayer(function (layer) {
                            if (layer instanceof L.Marker || layer instanceof L.Circle) {
                                map.removeLayer(layer);
                            }
                        });

                        // Add new weather marker
                        L.marker([data.latitude, data.longitude])
                            .addTo(map)
                            .bindPopup(`🌡️ Temp: ${temp}°F<br>💨 Wind: ${wind_speed} km/h<br>☁️ Cloud Cover: ${cloud_cover}%`)
                            .openPopup();

                        // Add a circle with color based on temperature
                        var color = temp > 77 ? 'red' : (temp > 59 ? 'orange' : 'blue');
                        L.circle([data.latitude, data.longitude], {
                            color: color,
                            fillColor: color,
                            fillOpacity: 0.5,
                            radius: 5000
                        }).addTo(map);
                    }
                })
                .catch(error => console.error("❌ Error loading weather data:", error));
        }

        // Auto-update every 60 seconds
        setInterval(updateWeatherOverlay, 60000);
        updateWeatherOverlay();
    </script>
</body>
</html>
